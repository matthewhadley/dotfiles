# The schema URL below is one unbreakable token, and the line cannot be
# wrapped: yaml-language-server parses it to bind the schema, so splitting it
# would silently turn schema validation off. Verified that the directive still
# binds from line 2, so this comment can sit above it.
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/razajamil/herdr-plugin-workspace-manager/main/schema.json
layouts:
  - id: standard
    tabs:
      - title: claude
        panes:
          - title: claude
            agent: claude
      - title: zsh
        panes:
          - title: zsh
      - title: neovim
        panes:
          - title: neovim
            command: nv
      - title: lazygit
        panes:
          - title: lazygit
            command: lazygit
            persist: false
      - title: hunk
        panes:
          - title: hunk
            command: hunk diff --watch

      # Complementary to the hunk tab above, not a replacement for it:
      #
      #   hunk    the working tree -- what is not committed yet
      #   branch  merge-base..HEAD -- what this branch adds over its base
      #
      # The second is what a worktree is usually for, and it is the one that
      # is awkward to type: `git diff main` compares the two tips, so anything
      # that lands on main after you branch shows up inverted as your deletion.
      # hunk-branch-diff (~/.local/bin) finds the base from origin/HEAD and
      # hands hunk `<base>...HEAD`. Refs rather than resolved hashes, so a
      # rebase onto a base that has moved does not strand the pane at the old
      # branch point. On the base branch the range is empty and the tab shows
      # nothing until there is a commit; where the range cannot exist at all --
      # no origin/HEAD, or the orphan bare-repo branch, which has no merge base
      # -- it says so and shows the working tree instead.
      - title: branch
        panes:
          - title: branch
            command: hunk-branch-diff

  # standard, but for the dotfiles bare repo. Applied to a workspace rooted at
  # ~/dev/dotfiles -- a linked worktree of ~/.dotfiles on an orphan `bare-repo`
  # branch holding only README.md and AGENTS.md. That directory exists to be a
  # project root: $HOME is the real work tree but a poor root, and ~/.dotfiles
  # is a bare git dir with nothing in it but objects/ and refs/.
  #
  # Consequence: the workspace cwd is NOT the work tree, and panes cannot set
  # their own cwd (the schema gives them only title/command/env/agent/split --
  # no cwd), so each pane below deals with it in the way that suits it:
  #
  #   nvim, lazygit  nothing to do. `dotfiles nv` cds to $HOME in a subshell
  #                  of its own, and `dotfiles lazygit` passes --git-dir and
  #                  --work-tree, so both are cwd-independent already.
  #   hunk, zsh      `cd ~` first. The wrapper deliberately omits -C "$HOME"
  #                  so pathspecs resolve against the caller -- which is what
  #                  makes `cd ~/.config/ghostty && dotfiles add config` work,
  #                  and what would otherwise send these two looking under
  #                  ~/dev/dotfiles/. Joined with "; " ahead of the plugin's
  #                  `exec "$SHELL" -i` handback, so the cd survives into the
  #                  interactive shell.
  #   agent          stays at ~/dev/dotfiles, and reads the AGENTS.md there.
  #                  Reaching the real dotfiles is by absolute path, which
  #                  works fine; only Grep/Glob need an explicit path.
  - id: dotfiles
    tabs:
      - title: claude
        panes:
          - title: claude
            agent: claude
      - title: zsh
        panes:
          - title: zsh
            command: cd ~
      - title: neovim
        panes:
          - title: neovim
            command: dotfiles nv
      - title: lazygit
        panes:
          - title: lazygit
            command: dotfiles lazygit
            persist: false
      - title: hunk
        panes:
          - title: hunk
            # Splices to `hunk diff --exclude-untracked --watch`. The exclude
            # is load-bearing: $HOME holds half a million untracked files and
            # hunk's `git ls-files --others` ignores status.showUntrackedFiles.
            command: cd ~ && dotfiles hunk --watch

# Fallback for any repo below with no workspaces: entry of its own. Only
# fires for a genuinely NEW linked worktree (never the repo's main checkout,
# and never a workspace that already has more than 1 tab/pane) -- see
# is_linked_worktree in src/main.rs. So this gives every new worktree you
# create (e.g. via worktrunk's `wt`) the standard layout for free; it does
# nothing for a project's already-existing primary checkout.
globalLayout: standard

# workspaces: per-repo overrides go here when a project wants something other
# than globalLayout (e.g. `- repo: ~/dev/some-project, defaultLayout: other`).
# Omitted entirely: not needed just to opt a normal repo INTO the shared
# layout, since globalLayout already covers that.
#
# Worth knowing before adding one: on this machine `herdr workspace list`
# emits no `worktree` object at all, even for an ordinary repo. The plugin
# sources target.cwd from worktree.checkout_path (apply_core.rs resolve_target)
# and match_score needs Some(checkout_path) for a `path:` rule and
# Some(repo_root) for a `repo:` rule (config.rs), so NO workspaces entry can
# currently match anything -- match_workspace_layout always falls through to
# globalLayout. An entry added here would be inert; name the layout explicitly
# instead.
#
# That is doubly true of the dotfiles repo. Its work tree is $HOME, which git
# discovery never sees, so even a herdr that did report worktrees would report
# none for a pane standing there. ~/dev/dotfiles IS a discoverable worktree --
# but on the orphan `bare-repo` branch, so matching it by repo_root would
# resolve the whole dotfiles setup to a two-file landing checkout.
#
# The dotfiles layout is therefore selected by name, not by matching:
#   HERDR_WSM_LAYOUT=dotfiles herdr-workspace-manager apply
# The custom plugin's open-project.sh does exactly that when the directory
# picked is ~/dev/dotfiles, so `Open project` -> `dotfiles` just works.
