id = "custom"
name = "Custom"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Personal fzf-driven workspace/worktree helpers with workspace-manager layout auto-apply."
platforms = ["macos", "linux"]

# Keep the dotfiles workspace's $dotfiles sidebar token current. Reported once
# when the server restores its session, then refreshed on every workspace
# switch -- there is no event for "you committed", and a focus hook is the
# cheapest thing that fires often enough to stay roughly true. The script exits
# immediately when the dotfiles workspace isn't open, and does only ref reads
# otherwise.
[[startup]]
command = ["bash", "dotfiles-status.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "dotfiles-status.sh"]

# Keep each agent row's $last_prompt token current. Driven by agent state rather
# than by a prompt event, because there is no prompt event -- the closest herdr
# publishes is pane.agent_status_changed, and going idle -> working is what
# submitting a prompt looks like from the outside. The script reads the affected
# pane only, which the event names in its payload.
#
# Startup repopulates every pane: token metadata is not restored after a server
# restart, so without this the rows come back blank and stay blank until each
# agent next changes state.
[[startup]]
command = ["bash", "agent-prompts.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "agent-prompts.sh"]

# Manual refresh, mostly for when the event has been missed or the mapping is
# being changed. Covers every pane rather than one.
[[actions]]
id = "agent-prompts"
title = "Refresh agent prompts"
command = ["bash", "agent-prompts.sh"]

# Manual refresh, for when a commit or push should show up without waiting for
# the next workspace switch.
[[actions]]
id = "dotfiles-status"
title = "Refresh dotfiles status"
command = ["bash", "dotfiles-status.sh"]

[[actions]]
id = "open-project"
title = "Open project"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin custom --entrypoint open-project"]

# The same picker again, with Enter changed to mean "create the typed name here"
# rather than "open what the query matched". Its own action because that is not a
# thing a key inside Open project could express: typing "ap" where ~/dev/apple
# exists matches, and fzf opens matches -- so the intent has to be declared
# before the picker starts, not signalled during it.
[[actions]]
id = "new-project"
title = "New project"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin custom --entrypoint new-project"]

[[actions]]
id = "new-worktree"
title = "Open worktree"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin custom --entrypoint new-worktree"]

# The same picker as open-project, with a header advertising the paste-a-URL
# gesture -- so "clone" is discoverable from the palette rather than being
# folklore. It is one script and one code path: the directory being browsed is
# the clone destination, which is also what makes the shared
# workspace-create/layout tail reusable without a second entry point.
#
# "Clone git repo" rather than "Clone repo" so that typing `git clone` finds it.
# vjeantet.palette matches with nucleo (src/ui/tui.rs, Pattern::parse), which
# splits a query on whitespace into independent atoms -- every atom has to match
# somewhere in the label, but their order relative to each other does not. Under
# a single in-order fuzzy match `git clone` would find nothing here, since no
# "clone" follows the "git".
[[actions]]
id = "clone-repo"
title = "Clone git repo"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin custom --entrypoint clone-repo"]

[[actions]]
id = "clone-pr"
title = "Clone PR"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin custom --entrypoint clone-pr"]

[[actions]]
id = "browse-pr"
title = "Browse PR"
contexts = ["workspace"]
command = ["bash", "browse-pr.sh"]

[[panes]]
id = "open-project"
title = "Open project"
placement = "popup"
width = "60%"
height = "50%"
command = ["bash", "open-project.sh"]

[[panes]]
id = "new-project"
title = "New project"
placement = "popup"
width = "60%"
height = "50%"
command = ["bash", "open-project.sh", "--new"]

[[panes]]
id = "new-worktree"
title = "Open worktree"
placement = "popup"
width = "60%"
height = "50%"
command = ["bash", "new-worktree.sh"]

# Same geometry as open-project, because it is the same picker: the clone itself
# does not run here. Pasting a URL opens a full-size tab in the current
# workspace and this popup closes -- see the two-phase note in open-project.sh.
[[panes]]
id = "clone-repo"
title = "Clone git repo"
placement = "popup"
width = "60%"
height = "50%"
command = ["bash", "open-project.sh", "--clone"]

[[panes]]
id = "clone-pr"
title = "Clone PR"
placement = "popup"
width = "70%"
height = "50%"
command = ["bash", "clone-pr.sh"]
