onboarding = false

[keys]
previous_tab = "prefix+p"
next_tab = "prefix+n"
# Reached via Cmd+Up/Cmd+Down, which Ghostty rewrites to these prefix
# sequences; u/d are just free letters, not meant to be typed directly.
previous_workspace = "prefix+u"
next_workspace = "prefix+d"
toggle_sidebar = "super+b"

[[keys.command]]
key = "super+p"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"


# The plannotator-tui split pane needs a focus event to trigger its first
# proper redraw -- confirmed: it renders wonky until clicked, and a mouse
# click's only relevant side effect is giving it focus. `type = "shell"`
# chains the plugin action with a `herdr pane focus` call so one keypress
# does what a keypress-then-click used to. `--direction right` matches
# plannotator-tui's split_direction = "right" in its own config.toml; if
# that ever changes, update the direction here too. The sleep is a guess at
# how long pane creation takes to register before focus can target it --
# unverified, since this needs a live TUI to test; shorten or lengthen it if
# the focus fires too early/late.
[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr plugin action invoke annotate.last && sleep 0.15 && herdr pane focus --direction right"
description = "review the agent's last reply, focused"

[[keys.command]]
key = "super+shift+a"
type = "shell"
command = "herdr plugin action invoke annotate.last && sleep 0.15 && herdr pane focus --direction right"
description = "review the agent's last reply, focused"

# Overrides herdr's built-in "new worktree" on the same key with worktrunk's
# switch/create picker (hooks + auto-layout via herdr-plugin-workspace-manager).
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

# Pick a directory under ~/dev, open it as a workspace, and force-apply the
# workspace-manager layout (bypasses its claim guard, unlike the automatic
# hook). Backed by the local "custom" plugin (see
# ~/.config/herdr/plugins/local/custom/) rather than a bare popup command,
# so the popup gets a real title and it's dispatchable/discoverable from
# vjeantet.palette like any other plugin action.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "custom.open-project"
description = "Open project and apply workspace layout"

[[keys.command]]
key = "super+o"
type = "plugin_action"
command = "custom.open-project"
description = "Open project and apply workspace layout"

# From inside an existing repo's workspace: worktrunk's switch/create picker
# (same as worktrunk.open), then force-apply the layout even to an
# already-claimed worktree.
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "custom.new-worktree"
description = "New/Open worktree and apply workspace layout"

[ui.toast]
delivery = "herdr"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
pane_borders = false
pane_scrollbars = false
pane_gaps = true
tab_bar_position = "top"
status_indicators = "dots"

[theme]
name = "gruvbox"
auto_switch = false

