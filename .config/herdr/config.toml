onboarding = false

[keys]
previous_tab = "prefix+p"
next_tab = "prefix+n"
# Reached via Cmd+Up/Cmd+Down, which Ghostty rewrites to these prefix
# sequences; u/d are just free letters, not meant to be typed directly.
previous_workspace = "prefix+u"
next_workspace = "prefix+d"
toggle_sidebar = "super+b"

[[keys.command]]
key = "super+p"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"


# The plannotator-tui split pane needs a focus event to trigger its first
# proper redraw -- confirmed: it renders wonky until clicked, and a mouse
# click's only relevant side effect is giving it focus. `type = "shell"`
# chains the plugin action with a `herdr pane focus` call so one keypress
# does what a keypress-then-click used to. `--direction right` matches
# plannotator-tui's split_direction = "right" in its own config.toml; if
# that ever changes, update the direction here too. The sleep is a guess at
# how long pane creation takes to register before focus can target it --
# unverified, since this needs a live TUI to test; shorten or lengthen it if
# the focus fires too early/late.
[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr plugin action invoke annotate.last && sleep 0.15 && herdr pane focus --direction right"
description = "review the agent's last reply, focused"

[[keys.command]]
key = "super+shift+a"
type = "shell"
command = "herdr plugin action invoke annotate.last && sleep 0.15 && herdr pane focus --direction right"
description = "review the agent's last reply, focused"

# Overrides herdr's built-in "new worktree" on the same key with worktrunk's
# switch/create picker (hooks + auto-layout via herdr-plugin-workspace-manager).
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

# Pick a directory under ~/dev, open it as a workspace, and force-apply the
# workspace-manager layout (bypasses its claim guard, unlike the automatic
# hook). Backed by the local "custom" plugin (see
# ~/.config/herdr/plugins/local/custom/) rather than a bare popup command,
# so the popup gets a real title and it's dispatchable/discoverable from
# vjeantet.palette like any other plugin action.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "custom.open-project"
description = "Open project and apply workspace layout"

[[keys.command]]
key = "super+o"
type = "plugin_action"
command = "custom.open-project"
description = "Open project and apply workspace layout"

# From inside an existing repo's workspace: worktrunk's switch/create picker
# (same as worktrunk.open), then force-apply the layout even to an
# already-claimed worktree.
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "custom.new-worktree"
description = "Open worktree and apply workspace layout"

[ui.toast]
delivery = "herdr"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
pane_borders = false
pane_scrollbars = false
pane_gaps = true
tab_bar_position = "top"
status_indicators = "dots"

# Default is [["state_icon", "workspace"], ["branch", "git_status"]]. The extra
# tokens are workspace metadata reported by the custom plugin's
# dotfiles-status.sh. The branch this Space shows is the landing worktree's own
# `bare-repo`, which is the right label but has no upstream, so its git_status
# is always empty -- the ahead/behind worth seeing belongs to `main` over in
# $HOME. Every other Space leaves them unset, where they render as nothing.
#
# The colours are the gruvbox palette's `green` and `red` (src/app/state.rs),
# which is what sidebar.rs paints a built-in ahead/behind marker with, in that
# order. fg wants a hex here: the palette names theme.custom.* accepts are
# rejected, and nothing exposes the live palette, so the values are written out
# and only hold while the theme does.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [
    "branch",
    "git_status",
    { token = "$dotfiles_ahead", fg = "#b8bb26" },
    { token = "$dotfiles_behind", fg = "#fb4934" },
  ],
]

# Built-in themes, read out of the binary rather than the docs, which list
# fewer: catppuccin, catppuccin-latte, terminal, tokyo-night, tokyo-night-day,
# dracula, nord, gruvbox, gruvbox-light, one-dark, one-light, solarized,
# solarized-light, kanagawa, kanagawa-lotus, rose-pine, rose-pine-dawn, vesper.
# `terminal` inherits the host terminal's palette instead of imposing one.
#
# A [theme.custom] table overrides individual tokens on top of whichever base
# `name` selects; [theme.custom.light] and [theme.custom.dark] layer on that
# when auto_switch is true. Values take hex, a colour name, rgb(r,g,b), or
# "reset" to fall through to the terminal.
#
# The token set is the ModeThemeColors struct, nineteen of them, and it is not
# documented anywhere -- the shipped template shows seven. Guessing names is a
# poor way to find them (half of these use catppuccin's palette vocabulary, and
# there is no cyan, orange or border); `herdr config check` is the oracle, since
# it reports an unknown key by name and ignores it rather than failing.
#
#   accent  panel_bg  sidebar_bg  active_row_bg  selection_bg
#   surface0  surface1  surface_dim  overlay0  overlay1
#   text  subtext0
#   mauve  green  yellow  red  blue  teal  peach
#
# Which token paints what, established by setting each to a distinct garish
# colour and reloading -- there is no other way to find out:
#
#   accent         active tab background; the `menu` dot
#   surface0       inactive tab backgrounds
#   overlay1       the `+` new-tab button; "spaces" and "agents" headers
#   active_row_bg  selected row background, spaces and agents both
#   subtext0       unselected row labels
#   overlay0       sub-labels (branch, agent name), the state bullets,
#                  and the "priority" header
#   text           the selected row's primary label
#   surface_dim    the sidebar/pane divider, and the horizontal rule above
#                  "agents" -- one token draws both
#   panel_bg       the strip behind the tabs, and the pane background
#
# Tab labels stayed dark against both the orange accent and the magenta
# surface0, so they look auto-contrasted rather than driven by text/subtext0 --
# one observation, not proof, but it suggests tab label colour is not settable.
#
# Not observed: selection_bg, which needs a live text selection, and surface1,
# which appeared nowhere in this layout at all.
#
# "reset" is only useful for a token that is genuinely a background. It means
# "fall through to the terminal", and for a glyph that resolves to the
# terminal's default *foreground* -- so surface_dim = "reset" made the dividers
# pale grey and more obvious, not less. Hiding a rule takes an explicit
# background hex, the same trick WinSeparator needs in ~/.config/nvim/init.lua.
# Two rounds were spent learning that.
#
# Note the ahead/behind hexes above are not part of this and do not follow the
# theme -- see the comment on [ui.sidebar.spaces].
[theme]
name = "terminal"
auto_switch = false

# `terminal` as the base, so everything not listed below inherits Ghostty's own
# palette rather than a scheme's. Gruvbox was the base while these values were
# chosen, which is why so much is overridden: its warm browns fought a cool
# terminal at every turn.
#
# The values are deliberately neutral greys rather than themed colour. Neovim's
# bufferline sits directly beneath this tab bar, and it is entirely monochrome
# cool teal -- measured: selected #152528, visible #132224, inactive #0f1b1e,
# strip #0b1416, with the selected buffer marked by bold light text rather than
# any fill. Two rows of dark teal chips a line apart are hard to tell apart, so
# herdr separates itself by *desaturation*: pure neutrals (R = G = B) against
# bufferline's tinted darks. It also leaves every remaining colour token free to
# mean status rather than decoration.
[theme.custom]
# Gruvbox aqua-green for finished notification dots.
blue = "#8EC07C"

# Gruvbox aqua-green for done agents.
teal = "#8EC07C"

# Gruvbox red for blocked/waiting agents.
red = "#FB4934"

# The tab strip vanishes into the terminal, leaving only the chips. A real
# background, so "reset" is the right tool and it follows Ghostty automatically.
panel_bg = "reset"

# Ghostty's background spelled out, which hides the sidebar/pane divider and the
# rule above "agents". Not "reset" -- see the note above on why that backfires
# for a glyph.
surface_dim = "#151C23"

# Active tab, and inactive tabs. The big lightness gap is what marks the active
# one, since the strip behind them is now invisible and there is no other cue.
accent = "#c8c8c8"
surface0 = "#303030"

# Four points per channel above Ghostty's #151C23, then halved to two: enough to
# sense a panel edge, not enough to read as a different colour. Keeps the
# blue-black hue -- a neutral grey here was tried first and looked wrong
# precisely because the pane beside it is tinted.
sidebar_bg = "#171E25"

# Matches surface0, so a selected sidebar row and an inactive tab are the same
# material. Neutral rather than blue-tinted, which ties it to the tabs at the
# cost of not quite matching the sidebar around it.
active_row_bg = "#303030"
